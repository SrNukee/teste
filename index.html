<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Dashboard Ecommerce</title>

<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>


  <script>
console.log("Plotly carregado:", typeof Plotly);
console.log("Papa carregado:", typeof Papa);
</script>

<style>

body{
    background:
    radial-gradient(circle at top left,
        rgba(168,85,247,.25),
        transparent 35%),

    radial-gradient(circle at top right,
        rgba(236,72,153,.20),
        transparent 35%),

    radial-gradient(circle at bottom center,
        rgba(59,130,246,.15),
        transparent 40%),

    #050816;

    color:white;
    font-family:'Inter',sans-serif;
    margin:0;
    padding:20px;
}

h1{
margin-bottom:20px;
}

.kpis{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:15px;
margin-bottom:20px;
}

.card{

    background:
    rgba(17,24,39,.75);

    backdrop-filter:
    blur(10px);

    border:
    1px solid rgba(236,72,153,.35);

    box-shadow:
    0 0 10px rgba(236,72,153,.15),
    0 0 25px rgba(236,72,153,.10);

    padding:20px;
    border-radius:18px;

    transition:.3s;

}

.card:hover{

    transform:
    translateY(-3px);

    box-shadow:
    0 0 15px rgba(236,72,153,.4),
    0 0 35px rgba(236,72,153,.25);

}


.card h3{
margin:0;
color:#9ca3af;
}

.card h2{

    font-size:2rem;
    font-weight:700;

    color:#00e5ff;

    text-shadow:
    0 0 8px rgba(0,229,255,.8);

}


.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
}

.chart{
background:#111827;
padding:15px;
border-radius:15px;
margin-bottom:20px;
}

#tabelaEstoque{
    font-size:14px;
    width:100%;
}

#tabelaEstoque th,
#tabelaEstoque td{
    padding:8px;
    border-bottom:1px solid #1f2937;
}

#tabelaEstoque th{
    position:sticky;
    top:0;
    background:#111827;
    text-align:left;
}

#tabelaEstoque{

    background:
    rgba(17,24,39,.4);

    border:
    1px solid rgba(168,85,247,.25);

    border-radius:15px;

}

#tabelaEstoque{
    width:100%;
    table-layout:fixed;
}

#tabelaEstoque th{

    background:
    rgba(168,85,247,.15);

    color:#f472b6;

    text-transform:uppercase;

    letter-spacing:1px;

}

#tabelaEstoque tbody tr:hover{

    background:
    rgba(236,72,153,.08);

}


#tabelaEstoque th:nth-child(1),
#tabelaEstoque td:nth-child(1){
    width:40%;
}

#tabelaEstoque th:nth-child(2),
#tabelaEstoque td:nth-child(2){
    width:8%;
    text-align:center;
}

#tabelaEstoque th:nth-child(3),
#tabelaEstoque td:nth-child(3){
    width:17%;
    text-align:right;
}

#tabelaEstoque th:nth-child(4),
#tabelaEstoque td:nth-child(4){
    width:17%;
    text-align:right;
}

#tabelaEstoque th:nth-child(5),
#tabelaEstoque td:nth-child(5){
    width:8%;
    text-align:center;
}

@media(max-width:900px){
.grid{
grid-template-columns:1fr;
}
}

</style>

</head>

<body>

<h1>📊 Dashboard de Vendas</h1>

<div class="kpis">
  
<div class="card">
    <h3>Última Atualização</h3>
    <h2 id="ultimaAtualizacao">-</h2>
</div>

<div class="card">
    <h3>💰 Valor em Estoque</h3>
    <h2 id="valorEstoque">-</h2>
</div>

<div class="card">
    <h3>🏆 Melhor Canal</h3>
    <h2 id="melhorCanal">-</h2>
</div>

<div class="card">
    <h3>🥇 Produto Mais Lucrativo</h3>
    <h2 id="melhorProduto">-</h2>
</div>

<div class="card">
    <h3>⚡ Prazo Médio Venda</h3>
    <h2 id="prazoMedio">-</h2>
</div>

</div>



<div class="chart">
<div id="lucroAcumulado"></div>
</div>

<div class="kpis">

<div class="card">
<h3>Lucro Total</h3>
<h2 id="lucroTotal">-</h2>
</div>

<div class="card">
<h3>Faturamento</h3>
<h2 id="faturamento">-</h2>
</div>

<div class="card">
<h3>Ticket Médio</h3>
<h2 id="ticket">-</h2>
</div>

<div class="card">
<h3>Vendas</h3>
<h2 id="vendas">-</h2>
</div>

<div class="card">
<h3>Lucro Médio</h3>
<h2 id="lucroMedio">-</h2>
</div>

<div class="card">
<h3>Estoque Aberto</h3>
<h2 id="estoque">-</h2>
</div>

</div>

<div class="grid">

<div class="chart">
<div id="lucroMes"></div>
</div>

<div class="chart">
<div id="fatMes"></div>
</div>

<div class="chart">
<div id="topProdutos"></div>
</div>

<div class="chart">
<div id="bottomProdutos"></div>
</div>

<div class="chart">
<div id="canais"></div>
</div>

<div class="chart">
<div id="prazoLucro"></div>
</div>

</div>

<div class="chart">

<h3>📦 Estoque Atual</h3>

<div style="
max-height:300px;
overflow-y:auto;
">

<table id="tabelaEstoque"
style="
width:100%;
border-collapse:collapse;
color:white;
">

<thead>
<tr>
<th>Produto</th>
<th>Qtd</th>
<th>Valor Unit.</th>
<th>Valor Estoque</th>
<th>Dias</th>
</tr>
</thead>


<tbody></tbody>

</table>

</div>

</div>

<script>

const CSV_URL =
'https://docs.google.com/spreadsheets/d/e/2PACX-1vR0zYaCXFQTdPJ0ze_HCpABeOtC5kfLlwAwhzWBKV_7v0BEFab5osnH9XVdd6-OxNGkEuZYi3-gVqxM/pub?output=csv';

function dinheiro(valor){

    if(valor === null || valor === undefined)
        return 0;

    valor = String(valor).trim();

    if(valor === "" || valor === "--")
        return 0;

    const negativo = valor.includes("-");

    valor = valor
        .replace(/R\$/g,"")
        .replace(/\s/g,"")
        .replace(/\./g,"")
        .replace(",",".")
        .replace(/[^0-9.]/g,"");

    let numero = parseFloat(valor);

    if(isNaN(numero))
        return 0;

    return negativo ? -numero : numero;
}

function dias(v){

if(!v) return null;

let n = String(v).match(/-?\d+/);

return n ? Number(n[0]) : null;

}

function moeda(v){

return v.toLocaleString(
'pt-BR',
{
style:'currency',
currency:'BRL'
}
);

}

Papa.parse(CSV_URL,{

download:true,
header:true,
skipEmptyLines:true,

complete:function(res){

document.getElementById("ultimaAtualizacao").innerHTML =
new Date().toLocaleString("pt-BR");

let dados = res.data;

dados.forEach(r=>{

r.lucro=dinheiro(r["LUCRO"]);
r.venda=dinheiro(r["VALOR DE VENDA"]);
r.compra=dinheiro(r["VALOR DE COMPRA"]);
r.prazo=dias(r["QTD DIAS VENDA"]);

});
  
const estoque =
dados.filter(
x => !x["DATA DE VENDA"]
);

console.log("DATA COMPRA:", estoque[0]["DATA DE COMPRA"]);

const valorEstoque =
estoque.reduce(
(acc,item)=>acc + (item.compra || 0),
0
);

document.getElementById("valorEstoque").innerHTML =
moeda(valorEstoque);

const tbody =
document.querySelector("#tabelaEstoque tbody");

tbody.innerHTML = "";

const estoqueAgrupado = {};

estoque.forEach(item=>{

    const nome =
    (item.ITEM || "Sem nome").trim();

    if(!estoqueAgrupado[nome]){

        estoqueAgrupado[nome] = {

            quantidade:0,
            valorTotal:0,
            somaValores:0,
            data:item["DATA DE COMPRA"] || null

        };

    }

    estoqueAgrupado[nome].quantidade++;

    estoqueAgrupado[nome].somaValores +=
    (item.compra || 0);

    estoqueAgrupado[nome].valorTotal +=
    (item.compra || 0);

function converterDataBR(txt){

    if(!txt) return null;

    const p = txt.split("/");

    if(p.length !== 3) return null;

    let ano = parseInt(p[2],10);

    if(ano < 100){
        ano += 2000;
    }

    return new Date(
        ano,
        parseInt(p[1],10)-1,
        parseInt(p[0],10)
    );

}

const dataAtual =
converterDataBR(item["DATA DE COMPRA"]);

const dataSalva =
converterDataBR(estoqueAgrupado[nome].data);

if(
    !isNaN(dataAtual) &&
    (
        isNaN(dataSalva) ||
        dataAtual < dataSalva
    )
){
    estoqueAgrupado[nome].data =
    item["DATA DE COMPRA"];
}

});

// Montar tabela

Object.entries(estoqueAgrupado)
.sort((a,b)=>
b[1].valorTotal - a[1].valorTotal
)
.forEach(([produto,dados])=>{

console.log(produto, dados.data);
  
let diasEstoque = "-";

const data = String(dados.data).trim();

if(data){

    const partes = data.split("/");

    if(partes.length === 3){

        const dia = parseInt(partes[0],10);
        const mes = parseInt(partes[1],10);

        let ano = parseInt(partes[2],10);

        if(ano < 100){
            ano += 2000;
        }

        const compra =
        new Date(ano, mes - 1, dia);

        const hoje = new Date();

        diasEstoque = Math.floor(
            (hoje.getTime() - compra.getTime())
            /
            (1000 * 60 * 60 * 24)
        );

    }

}

    // Data texto DD/MM/AAAA
    else{

        const partes = String(data).split("/");

        if(partes.length === 3){

const dia = Number(partes[0]);
const mes = Number(partes[1]);

let ano = Number(partes[2]);

if(ano < 100){
    ano += 2000;
}

const compra =
new Date(ano, mes - 1, dia);

            diasEstoque = Math.floor(
                (new Date() - compra) /
                (1000 * 60 * 60 * 24)
            );

        }

    }

}

    const valorUnitario =
    dados.somaValores /
    dados.quantidade;

    tbody.innerHTML += `
    <tr>

        <td>${produto}</td>

        <td style="text-align:center">
            ${dados.quantidade}
        </td>

        <td style="text-align:right">
            ${moeda(valorUnitario)}
        </td>

        <td style="text-align:right">
            ${moeda(dados.valorTotal)}
        </td>

        <td style="text-align:center">
            ${diasEstoque}
        </td>

    </tr>
    `;

});

const vendas = dados.filter(
    x =>
    x["DATA DE VENDA"] &&
    String(x["DATA DE VENDA"]).trim() !== "" &&
    String(x["DATA DE VENDA"]).trim() !== "--"
);

const lucroTotal =
vendas.reduce(
    (acc,item)=>acc + (item.lucro || 0),
0);

const faturamento =
vendas.reduce(
    (acc,item)=>acc + (item.venda || 0),
0);

const ticket =
vendas.length
? faturamento / vendas.length
: 0;

const lucroMedio =
vendas.length
? lucroTotal / vendas.length
: 0;

const prazoMedio =
vendas.reduce(
(acc,item)=>acc+(item.prazo||0),
0
)/vendas.length;

document.getElementById("prazoMedio").innerHTML =
prazoMedio.toFixed(1)+" dias";

document.getElementById("lucroTotal").innerHTML =
moeda(lucroTotal);

document.getElementById("faturamento").innerHTML =
moeda(faturamento);

document.getElementById("ticket").innerHTML =
moeda(ticket);

document.getElementById("vendas").innerHTML =
vendas.length;

document.getElementById("lucroMedio").innerHTML =
moeda(lucroMedio);

document.getElementById("estoque").innerHTML =
dados.filter(x=>!x["DATA DE VENDA"]).length;

const lucroMes = {};
const vendaMes = {};

vendas.forEach(v=>{

const d = new Date(v["DATA DE VENDA"]);

if(isNaN(d)) return;

const mes =
d.getFullYear() + "-" +
String(d.getMonth()+1).padStart(2,'0');

lucroMes[mes] =
(lucroMes[mes]||0)+v.lucro;

vendaMes[mes] =
(vendaMes[mes]||0)+v.venda;

});

const mesesOrdenados =
Object.keys(lucroMes).sort(
(a,b)=>
new Date(a+"-01") -
new Date(b+"-01")
);

const valoresLucro =
mesesOrdenados.map(
m => lucroMes[m]
);

Plotly.newPlot("lucroMes",[{
x:mesesOrdenados,
y:valoresLucro,
type:"bar",
marker:{
color:"#22d3ee"
}
}],
{
title:"Lucro Mensal",
paper_bgcolor:"rgba(17,24,39,.5)",
plot_bgcolor:"rgba(17,24,39,.3)",
font:{color:"white"}
});

Plotly.newPlot("fatMes",[{
x:Object.keys(vendaMes),
y:Object.values(vendaMes),
type:"bar"
}],
{
title:"Faturamento Mensal",
paper_bgcolor:"rgba(17,24,39,.5)",
plot_bgcolor:"rgba(17,24,39,.3)",
font:{color:"white"}
});

const produtos={};

vendas.forEach(v=>{

produtos[v.ITEM] =
(produtos[v.ITEM]||0)+v.lucro;

});

const ranking =
Object.entries(produtos)
.sort((a,b)=>b[1]-a[1]);

const melhorProduto = ranking[0];

document.getElementById("melhorProduto").innerHTML =
melhorProduto
? melhorProduto[0]
: "-";

Plotly.newPlot("topProdutos",[{
orientation:"h",
type:"bar",
y:ranking.slice(0,10).map(x=>x[0]),
x:ranking.slice(0,10).map(x=>x[1])
}],
{
title:"Top 10 Produtos",
paper_bgcolor:"rgba(17,24,39,.5)",
plot_bgcolor:"rgba(17,24,39,.3)",
font:{color:"white"}
});

Plotly.newPlot("bottomProdutos",[{
orientation:"h",
type:"bar",
y:ranking.slice(-10).map(x=>x[0]),
x:ranking.slice(-10).map(x=>x[1])
}],
{
title:"Menor Lucro",
paper_bgcolor:"rgba(17,24,39,.5)",
plot_bgcolor:"rgba(17,24,39,.3)",
font:{color:"white"}
});

const canais={};

vendas.forEach(v=>{

let canal=v["MEIO DE VENDA"];

if(!canal) canal="Outros";

canais[canal]=(canais[canal]||0)+v.lucro;

});

// Lucro acumulado

let acumulado = 0;

const valoresAcumulados =
Object.values(lucroMes)
.map(v => acumulado += v);

Plotly.newPlot(
"lucroAcumulado",
[{
x:Object.keys(lucroMes),
y:valoresAcumulados,
mode:"lines+markers",
type:"scatter",
fill:"tozeroy"
}],
{
title:"Lucro Acumulado",
paper_bgcolor:"rgba(17,24,39,.5)",
plot_bgcolor:"rgba(17,24,39,.3)",
font:{color:"white"}
}
);

const melhorCanal =
Object.entries(canais)
.sort((a,b)=>b[1]-a[1])[0];

document.getElementById("melhorCanal").innerHTML =
melhorCanal
? melhorCanal[0]
: "-";

Plotly.newPlot("canais",[{
labels:Object.keys(canais),
values:Object.values(canais),
type:"pie"
}],
{
title:"Lucro por Canal",
paper_bgcolor:"rgba(17,24,39,.5)",
font:{color:"white"}
});

Plotly.newPlot("prazoLucro",[{
    x:vendas.map(x=>x.prazo),
    y:vendas.map(x=>x.lucro),
    mode:"markers",
    type:"scatter"
}],
{
    title:"Prazo de Venda x Lucro",
    paper_bgcolor:"rgba(17,24,39,.5)",
    plot_bgcolor:"#111827",
    font:{color:"white"}
});

} // fecha complete

}); // fecha Papa.parse

</script>

</body>
</html>
